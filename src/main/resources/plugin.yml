name: NyrethaCore
version: 1.0.0
main: com.nyretha.Core
api-version: '1.21'
author: Nyretha
description: Core plugin for NyrethaSMP featuring home, pay, sell, shop, tools, and tpa systems.

commands:
  core:
    description: Main core command
    permission: core.admin
    aliases: [nyrethacore]
  home:
    description: Manage player homes
    aliases: [homes]
  pay:
    description: Send currency to players
  flakes:
    description: Manage player flakes currency
  rtp:
    description: Random teleport
  sell:
    description: Open sell GUI or sell items
  shop:
    description: Open main shop GUI
  team:
    description: Manage teams
  tools:
    description: Open tools GUI
  tpa:
    description: Send a TPA request
  tpaccept:
    description: Accept pending TPA request
  tpadeny:
    description: Deny pending TPA request
  archiveaustxn:
    description: A Command for ArchiveAustxn