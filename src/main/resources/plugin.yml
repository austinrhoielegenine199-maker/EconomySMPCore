name: NyrethaCore
version: '1.0'
main: com.nyretha.NyrethaCore
api-version: '1.21'
author: ArchiveAustxn, Lzy

commands:

  archiveaustxn:
    description: Special developer command for ArchiveAustxn.
    usage: /archiveaustxn

  team:
    description: Manage your team or faction.
    usage: /team <create|leave|disband>

  home:
    description: Teleport to your home.
    usage: /home

  sethome:
    description: Set your home location.
    usage: /sethome

  bal:
    description: Check balance.
    aliases:
      - balance
    usage: /bal [player]

  pay:
    description: Send money to a player.
    usage: /pay <player> <amount>

  eco:
    description: Manage player economy balances.
    permission: nyretha.eco.admin
    usage: /eco <give|take|set> <player> <amount>

  tpa:
    description: Send a teleport request to a player.
    usage: /tpa <player>

  tpahere:
    description: Request a player to teleport to you.
    usage: /tpahere <player>

  tp:
    description: Teleport to a player or location.
    permission: nyretha.staff.tp
    usage: /tp <player> [target]

  nv:
    description: Toggle night vision.
    permission: nyretha.nv
    usage: /nv

  shop:
    description: Open the server shop.
    usage: /shop

  ping:
    description: Check your network latency.
    permission: nyretha.ping
    usage: /ping

  ban:
    description: Permanently ban a player.
    permission: nyretha.staff.ban
    usage: /ban <player> [reason]

  tempban:
    description: Temporarily ban a player.
    permission: nyretha.staff.tempban
    usage: /tempban <player> <time> [reason]

  mute:
    description: Mute a player.
    permission: nyretha.staff.mute
    usage: /mute <player> [time]

  warn:
    description: Warn a player.
    permission: nyretha.staff.warn
    usage: /warn <player> [reason]

  help:
    description: View help information.
    usage: /help

  core:
    description: Core plugin management command.
    permission: nyretha.admin
    usage: /core reload

permissions:

  nyretha.eco.admin:
    description: Allows full access to administrative economy commands.
    default: op

  nyretha.staff.tp:
    description: Allows teleportation moderation.
    default: op

  nyretha.staff.ban:
    description: Allows banning players.
    default: op

  nyretha.staff.tempban:
    description: Allows temporary banning.
    default: op

  nyretha.staff.mute:
    description: Allows muting players.
    default: op

  nyretha.staff.warn:
    description: Allows warning players.
    default: op

  nyretha.nv:
    description: Allows use of night vision.
    default: op

  nyretha.ping:
    description: Allows use of /ping.
    default: true

  nyretha.shop.admin:
    description: Allows shop administration commands.
    default: op

  nyretha.admin:
    description: Allows access to NyrethaCore administration commands.
    default: op
