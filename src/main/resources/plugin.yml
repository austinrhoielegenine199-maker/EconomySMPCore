name: NyrethaCore
version: 1.0
main: com.nyretha.NyrethaCore
api-version: '1.21'
author: ArchiveAustxn, Lzy

commands:
  archiveaustxn:
    description: Special developer command.
    usage: /<command>

  team:
    description: Manage your team.
    usage: /<command>

  home:
    description: Teleport to your home.
    usage: /<command>

  sethome:
    description: Set your home.
    usage: /<command>

  bal:
    description: Check your balance.
    aliases:
      - balance
    usage: /<command> [player]

  pay:
    description: Send money to a player.
    usage: /<command> <player> <amount>

  eco:
    description: Manage player economy balances.
    permission: nyretha.eco.admin
    usage: /<command> <give|take|set> <player> <amount>

  tpa:
    description: Send a teleport request.
    usage: /<command> <player>

  tpahere:
    description: Request a player to teleport to you.
    usage: /<command> <player>

  tp:
    description: Teleport to a player.
    permission: nyretha.staff.tp
    usage: /<command> <player>

  nv:
    description: Toggle night vision.
    usage: /<command>

  shop:
    description: Open the server shop.
    usage: /<command>

  ping:
    description: Check your ping.
    usage: /<command>

  ban:
    description: Permanently ban a player.
    permission: nyretha.staff.ban
    usage: /<command> <player> [reason]

  tempban:
    description: Temporarily ban a player.
    permission: nyretha.staff.tempban
    usage: /<command> <player> <time> [reason]

  mute:
    description: Mute a player.
    permission: nyretha.staff.mute
    usage: /<command> <player> [time]

  warn:
    description: Warn a player.
    permission: nyretha.staff.warn
    usage: /<command> <player> [reason]

  help:
    description: View help information.
    usage: /<command>

  core:
    description: Core plugin management command.
    permission: nyretha.admin
    usage: /<command> reload

permissions:
  nyretha.eco.admin:
    description: Allows access to economy administration.
    default: op

  nyretha.staff.tp:
    description: Allows staff teleportation.
    default: op

  nyretha.staff.ban:
    description: Allows staff to ban players.
    default: op

  nyretha.staff.tempban:
    description: Allows staff to temporarily ban players.
    default: op

  nyretha.staff.mute:
    description: Allows staff to mute players.
    default: op

  nyretha.staff.warn:
    description: Allows staff to warn players.
    default: op

  nyretha.admin:
    description: Allows access to NyrethaCore administration.
    default: op
