  not-enough-money: "&cYou don't have enough money!"
  not-enough-flakes: "&cYou don't have enough flakes!"
  transaction-failed: '&cSend this a Server-Admin!'

purchase-success:
  module:
    chat:
      enabled: true
      message:
        - "&fYou bought &a{item} &ffor &#00FF00{price}&f!"
    actionbar:
      enabled: true
      message:
        - "&fYou bought &a{item} &ffor &#00FF00{price}&f!"
    title:
      enabled: false
      message:
        - ""
    subtitle:
      enabled: false
      message:
        - ""

purchase-flakes:
  module:
    chat:
      enabled: true
      message:
        - "&fYou bought a &a{item} &ffor &#00FF00{price} flakes&f!"
    actionbar:
      enabled: true
      message:
        - "&fYou bought a &a{item} &ffor &#00FF00{price} flakes&f!"
    title:
      enabled: false
      message:
        - ""
    subtitle:
      enabled: false
      message:
        - ""
