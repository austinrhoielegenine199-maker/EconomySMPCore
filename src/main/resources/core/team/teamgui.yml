Title: "ᴛᴇᴀᴍ (Page %page%)"
size: 54
member-slots: 0-44

member:
  online-color: '#00FC88'
  offline-color: '#FF0000'
  online-text: Online
  offline-text: Offline
  leader-tag: ' &e[Leader]'

sort:
  options:
    - join-date
    - permissions
    - money
    - alphabetical
    - online
  labels:
    join-date: Join Date
    permissions: Permissions
    money: Money
    alphabetical: Alphabetically
    online: Online Members
  selected-prefix: '#00FC88• '
  unselected-prefix: '#FFFFFF• '
  line-format: '%prefix%%label%'

items:
  member:
    name: '%status_color%■ #00FC88%player%'
    lore:
      - '#FFFFFFStatus: %status%'
      - '#FFFFFFClick to edit'

  invite:
    enabled: true
    material: GRAY_STAINED_GLASS_PANE
    name: '#00FC88ɪɴᴠɪᴛᴇ'
    lore:
      - '#FFFFFFClick to invite a new player'

  search:
    enabled: true
    material: OAK_SIGN
    slot: 45
    name: '#00FC88ѕᴇᴀʀᴄʜ'
    lore:
      - '#FFFFFFClick to search'

  sort:
    enabled: true
    material: HOPPER
    slot: 46
    name: '#00FC88ѕᴏʀᴛ'

  back:
    enabled: true
    material: ARROW
    slot: 48
    name: '#00FC88ʙᴀᴄᴋ'
    lore:
      - '#FFFFFFClick to go to the previous page'

  info:
    enabled: true
    material: IRON_HELMET
    slot: 49
    name: '#00FC88ᴛᴇᴀᴍ %team_name%'
    lore:
      - '#FFFFFFClick to refresh'
      - '#AAAAAAAdd up to 50 team members'

  next:
    enabled: true
    material: ARROW
    slot: 50
    name: '#00FC88ɴᴇхᴛ'
    lore:
      - '#FFFFFFClick to go to the next page'

  home:
    enabled: true
    material: WHITE_BANNER
    slot: 52
    name: '#00FC88ᴛᴇᴀᴍ ʜᴏᴍᴇ'
    lore-set:
      - '#FFFFFFClick to teleport to ᴛᴇᴀ繆 ʜᴏᴍᴇ'
    lore-unset:
      - '#FFFFFFSet the team home with /team sethome'

  pvp:
    enabled: true
    material: IRON_SWORD
    slot: 53
    name: '#00FC88ᴘᴠᴘ'
    lore:
      - '#FFFFFFCurrently: %status%'
    on-text: '#3AFF00&lON'
    off-text: '#FF0000&lOFF'

team-delete-confirm:
  title: "ᴄᴏɴꜰɪʀᴍ ᴅᴇʟᴇᴛᴇ"
  rows: 3
  cancel:
    slot: 11
    material: RED_STAINED_GLASS_PANE
    name: '#FF0000ᴄᴀɴᴄᴇʟ'
    lore:
      - '#FFFFFFClick to cancel'
  team-home-icon:
    slot: 13
    material: WHITE_BANNER
    name: '#009bffᴛᴇᴀᴍ ʜᴏᴍᴇ'
    lore: []
  confirm:
    slot: 15
    material: LIME_STAINED_GLASS_PANE
    name: '#00FF00ᴄᴏɴꜰɪʀᴍ'
    lore:
      - '#FFFFFFClick to delete'

teleport:
  countdown-seconds: 5
  countdown: '&7Teleporting in #2399FF%seconds%s'
  cancelled: '&cTeleport cancelled because you moved.'
  teleported: '&7You teleported to team home.'

messages:
  invite-hint: '&7Type /team invite (name) to invite a player'
  cannot-manage-leader: '&cYou cannot manage the team leader.'
  no-home: '&cYour team does not have a home.'
  no-home-permission: '&cYou do not have permission to go to the team home.'
