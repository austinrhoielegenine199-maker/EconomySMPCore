blacklisted-blocks:
  - LAVA
  - WATER

blacklisted-biomes:
  - BEACH

allowed-walk-range: 3
wait-time-seconds: 5
default-cooldown-seconds: 60
pregenerate-location-amount: 10

effects-on-random-teleport:
  '1':
    type: ABSORPTION
    level: 10
    seconds: 10

world-settings:
  overworld-region:
    world: world
    min-x: -50000
    max-x: 50000
    min-z: -50000
    max-z: 50000

  nether-region:
    world: world_nether
    min-x: -50000
    max-x: 50000
    min-z: -50000
    max-z: 50000

  end-region:
    world: world_the_end
    min-x: -50000
    max-x: 50000
    min-z: -50000
    max-z: 50000

rtp-zones:
  '1':
    enabled: true
    zone-region: rtpzone
    zone-world: world
    cooldown-time: 60
    minimum-players: 1
    arena-distance: 10
    glowing-duration: 6
    rtp-worlds:
      - world

sound:
  teleport_cooldown: block.note_block.pling
  teleporting: entity.enderman.teleport
  button_click: ui.button.click
  teleport_success: entity.player.levelup
  teleport_fail: entity.villager.no
  reload: entity.experience_orb.pickup
