delete-confirm:
  title: Confirm Delete
  rows: 3

  cancel:
    slot: 11
    material: RED_STAINED_GLASS_PANE
    name: '#FF1D1Dᴄᴀɴᴄᴇʟ'
    lore:
    - '&fClick to cancel'

  home-display:
    slot: 13
    material: BLUE_DYE
    name: '#009bffʜᴏᴍᴇ #009bff{number}{name}'

  confirm:
    slot: 15
    material: LIME_STAINED_GLASS_PANE
    name: '#3AFF00ᴄᴏɴꜰɪʀᴍ'
    lore:
    - '&fClick to delete'

  warning:
    material: LIME_STAINED_GLASS_PANE
    name: '#3AFF00ᴄᴏɴꜰɪʀᴍ'
    lore: '&fClick to confirm'

team-delete-confirm:
  title: ᴄᴏɴꜰɪʀᴍ ᴅᴇʟᴇᴛᴇ
  rows: 3

  cancel:
    slot: 11
    material: RED_STAINED_GLASS_PANE
    name: '#FF0000ᴄᴀɴᴄᴇʟ'
    lore:
    - '#FFFFFFClick to cancel'

  team-home-icon:
    slot: 13
    material: WHITE_BANNER
    name: '#009bffᴛᴇᴀᴍ ʜᴏᴍᴇ'
    lore: []

  confirm:
    slot: 15
    material: LIME_STAINED_GLASS_PANE
    name: '#00FF00ᴄᴏɴꜰɪʀᴍ'
    lore:
    - '#FFFFFFClick to delete'

confirm-delete:
  title: Confirm Delete
  size: 27
  cancel:
    slot: 11
    material: RED_STAINED_GLASS_PANE
    name: '#FFFFFFCancel'
    lore: '#AAAAAAClick to cancel'
  home-display:
    slot: 13
    material: WHITE_BED
    name: '#FFFFFF%name%'
  confirm:
    slot: 15
    material: LIME_STAINED_GLASS_PANE
    name: '#FFFFFFConfirm'
    lore: '#AAAAAAClick to delete'

team-home-delete:
  confirm:
    lore: '&fClick again to confirm'

home-icons:
  title: Home Icons %page%/%pages%
  size: 54
  icon:
    name: '#FFFFFF%icon%'
    lore: '#AAAAAA&oClick to use this icon'
  current:
    slot: 49
    name: '#FFFFFFCurrent Icon'
    lore-icon: '#AAAAAA&o%icon%'
    lore-home: '#AAAAAA&o%home%'
  previous:
    slot: 45
    material: ARROW
    name: '#FFFFFFPrevious'
    lore: '#AAAAAA&oGo to page %page%.'
    lore-none: '#AAAAAA&oNo previous page.'
  next:
    slot: 53
    material: ARROW
    name: '#FFFFFFNext'
    lore: '#AAAAAA&oGo to page %page%.'
  back:
    slot: 46
    material: RED_STAINED_GLASS_PANE
    name: '#FF5555Back'
    lore: '#AAAAAA&oReturn to homes.'
  default:
    slot: 50
    material: WHITE_BED
    name: '#FFFFFFDefault'
    lore: '#AAAAAA&oUse the default bed icon.'
  search:
    slot: 52
    material: OAK_SIGN
    name: '#FFFFFFSearch'
    lore: '#AAAAAA&oFilter items'

# Teleport countdown (moving cancels it). countdown-seconds: 0 = instant. "" = send nothing.
teleport:
  countdown-seconds: 5
  countdown: '&7Teleporting in #2399FF%seconds%s'
  cancelled: '&cTeleport cancelled because you moved.'
  teleported: '&7You teleported to your home'

home-manage:
  title: '%name%'
  title-unnamed: Home %number%
  buttons:
    teleport:
      slot: 0
      material: LODESTONE
      name: '#FFFFFFTeleport'
      lore:
      - '#AAAAAA&oClick to teleport'
    rename:
      slot: 1
      material: WRITABLE_BOOK
      name: '#FFFFFFRename'
      lore:
      - '#AAAAAA&oClick to rename'
    icon:
      slot: 2
      material: WHITE_BED
      name: '#FFFFFFIcon'
      lore:
      - '#AAAAAA&oClick to select home icon'
    delete:
      slot: 4
      material: LAVA_BUCKET
      name: '#FFFFFFDelete'
      lore:
      - '#AAAAAA&oClick to delete'
  sign:
    material: OAK_SIGN
    lines:
    - ''
    - ↑↑↑↑↑↑↑↑↑↑↑↑
    - New Name
    - ''
  fillers: {}
